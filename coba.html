<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <!-- Pico CSS: Biar tampilan langsung rapi & modern tanpa nulis CSS panjang -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>

<body>

    <!-- Container Utama -->
    <main class="container" style="max-width: 500px; margin-top: 50px;">
        <h3 style="text-align: center;">🔍 GitHub Profile Finder</h3>

        <!-- 1. Form Input -->
        <form id="formCari">
            <fieldset role="group">
                <input type="text" id="inputUsername" placeholder="Masukkan username GitHub..." required>
                <button type="submit">Cari</button>
            </fieldset>
        </form>

        <!-- 2. Wadah Status (Loading / Error 404) -->
        <p id="status" style="text-align: center; font-weight: bold; min-height: 24px;"></p>

        <!-- 3. Wadah Hasil Profil (Disembunyikan secara default) -->
        <article id="hasil" style="display: none; text-align: center;">
            <img id="avatar" style="width: 120px; border-radius: 50%; border: 3px solid #2ea44f; margin-bottom: 10px;">
            <h3 id="nama" style="margin-bottom: 0;"></h3>
            <p id="bio" style="color: #666; font-style: italic;"></p>
            <p>Jumlah Repositori Publik: <mark id="repos"></mark></p>
            <a id="linkProfil" target="_blank" role="button">Kunjungi Profil GitHub</a>
        </article>
    </main>

    <script>
        // Ambil elemen HTML yang dibutuhkan
        const form = document.getElementById('formCari');
        const input = document.getElementById('inputUsername');
        const status = document.getElementById('status');
        const hasil = document.getElementById('hasil');

        // Jalankan fungsi saat form di-submit (tombol cari diklik / enter)
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Mencegah halaman refresh saat form disubmit

            const username = input.value.trim();

            // Reset tampilan setiap kali mencari
            status.innerText = "⏳ Memuat data...";
            status.style.color = "blue";
            hasil.style.display = "none";

            try {
                // Memanggil API Publik GitHub
                const response = await fetch(`https://api.github.com/users/${username}`);

                // Cek jika status 404 (User tidak ditemukan)
                if (response.status === 404) {
                    throw new Error("❌ User tidak ditemukan!");
                }

                // Cek jika error lain (misal kena limit API 403)
                if (!response.ok) {
                    throw new Error("❌ Gagal mengambil data (Coba lagi nanti).");
                }

                // Ubah response menjadi JSON
                const data = await response.json();

                // Jika berhasil, tampilkan data
                status.innerText = ""; // Hilangkan teks loading
                hasil.style.display = "block"; // Munculkan kotak hasil

                // Masukkan data ke dalam HTML
                document.getElementById('avatar').src = data.avatar_url;
                document.getElementById('nama').innerText = data.name || data.login; // Antisipasi jika nama kosong
                document.getElementById('bio').innerText = data.bio || "Tidak ada bio.";
                document.getElementById('repos').innerText = data.public_repos;
                document.getElementById('linkProfil').href = data.html_url;

            } catch (error) {
                // Tampilkan pesan error jika terjadi masalah
                status.innerText = error.message;
                status.style.color = "red";
                hasil.style.display = "none";
            }
        });
    </script>

</body>

</html>
